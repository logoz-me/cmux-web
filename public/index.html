<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>cmux</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%233E77FC'/><text x='16' y='23' font-size='19' text-anchor='middle' fill='white' font-family='monospace'>c</text></svg>">
</head>
<body>

  <div id="window">

    <!-- ------------------------------------------------------ title bar -->
    <header id="titlebar">
      <div class="tb-sidebar">
        <div class="traffic"><i class="tl-r"></i><i class="tl-y"></i><i class="tl-g"></i></div>
        <div class="tb-buttons">
          <button id="tb-menu" class="tb-btn only-mobile" title="Workspaces">
            <svg viewBox="0 0 16 16" width="16" height="16"><path d="M2.5 4.2h11M2.5 8h11M2.5 11.8h11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <button id="tb-sidebar" class="tb-btn seg-on" title="Afficher/masquer la sidebar">
            <svg viewBox="0 0 16 16" width="15" height="15"><rect x="1.2" y="2.2" width="9.5" height="11.6" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M12.4 6.2h2.1M12.4 8h2.1M12.4 9.8h2.1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><circle cx="6" cy="11" r="1.7" fill="currentColor"/></svg>
          </button>
          <button id="tb-split" class="tb-btn" title="Diviser le panneau">
            <svg viewBox="0 0 16 16" width="15" height="15"><rect x="1.4" y="2.4" width="13.2" height="11.2" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 2.4v11.2" stroke="currentColor" stroke-width="1.3"/></svg>
          </button>
          <button id="tb-bell" class="tb-btn" title="Notifications">
            <svg viewBox="0 0 16 16" width="15" height="15"><path d="M8 1.8a4 4 0 0 0-4 4c0 3-1.2 4-1.2 4h10.4S12 8.8 12 5.8a4 4 0 0 0-4-4Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M6.6 12.4a1.6 1.6 0 0 0 2.8 0" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            <span id="tb-badge" class="badge" hidden>0</span>
          </button>
          <button id="tb-new" class="tb-btn" title="Nouveau workspace">
            <svg viewBox="0 0 16 16" width="15" height="15"><path d="M8 3.2v9.6M3.2 8h9.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>

      <div class="tb-canvas">
        <span id="tb-folder" class="tb-folder">
          <svg viewBox="0 0 16 16" width="14" height="14"><path d="M1.5 4.2A1.2 1.2 0 0 1 2.7 3h3l1.4 1.6h6.2a1.2 1.2 0 0 1 1.2 1.2v6A1.2 1.2 0 0 1 13.3 13H2.7a1.2 1.2 0 0 1-1.2-1.2V4.2Z" fill="currentColor"/></svg>
        </span>
        <span id="tb-title" class="tb-title">cmux</span>
        <span class="spacer"></span>
        <button id="tb-font" class="tb-btn only-mobile" title="Taille du texte">Aa</button>
        <button id="tb-right" class="tb-btn" title="Barre latérale droite">
          <svg viewBox="0 0 16 16" width="15" height="15"><rect x="1.4" y="2.6" width="13.2" height="10.8" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M10 2.6v10.8" stroke="currentColor" stroke-width="1.3"/></svg>
        </button>
      </div>
    </header>

    <!-- ---------------------------------------------------------- body -->
    <div id="body">

      <aside id="sidebar">
        <div class="search hidden">
          <svg viewBox="0 0 16 16" width="12" height="12"><circle cx="7" cy="7" r="4.4" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="m10.4 10.4 3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <input id="search" type="search" placeholder="Rechercher" spellcheck="false">
        </div>
        <div id="ws-list" class="ws-list"></div>
      </aside>

      <main id="canvas">
        <div id="panes" class="panes"></div>
        <div id="empty" class="empty">Sélectionnez un workspace</div>
        <input id="kbd" class="kbd-capture" spellcheck="false" autocomplete="off">
      </main>

      <aside id="rightbar" class="hidden">
        <div class="rb-modes">
          <button data-mode="files" title="Fichiers">📁</button>
          <button data-mode="find" title="Rechercher">🔍</button>
          <button data-mode="sessions" title="Sessions">💬</button>
          <button data-mode="feed" title="Feed">📈</button>
          <button data-mode="todo" title="Tâches">☑</button>
        </div>
        <div id="rb-body" class="rb-body"></div>
      </aside>

    </div>
  </div>

  <!-- ------------------------------------------------ barre d'actions bas -->
  <div id="mobilebar" class="only-mobile">
    <button data-key="escape">Échap</button>
    <button data-key="tab">Tab</button>
    <button id="mb-ctrl" class="mb-mod">Ctrl</button>
    <button data-key="ctrl+c">C</button>
    <button data-key="enter">⏎</button>
    <button data-key="up">↑</button>
    <button data-key="down">↓</button>
    <button data-key="left">←</button>
    <button data-key="right">→</button>
    <button id="mb-keys">⌨</button>
  </div>

  <div id="hint-bar"><span id="hint"></span></div>

  <div id="scrim" class="only-mobile"></div>

  <div id="notif-panel" class="panel hidden">
    <div class="panel-head">Notifications <button id="notif-close" class="ghost">✕</button></div>
    <div id="notif-list"></div>
  </div>

  <!-- -------------------------------------------------------- menu ctx -->
  <div id="menu" class="ctx-menu hidden"></div>

  <!-- ------------------------------------------------------ palette -->
  <div id="palette" class="palette hidden">
    <input id="palette-input" type="text" placeholder="Commande cmux…" spellcheck="false">
    <div id="palette-list"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
